name: Tag on PR Merge

on:
  push:
    branches: ["main", "master"]

# Serialize releases (shared with release-manual.yml) so two merges can never
# race for the same version or interleave their release builds.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    env:
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # --- Find the merged PR for this commit (commits API, not search) ---
          PR=""
          for attempt in 1 2 3 4 5; do
            PULLS=$(gh api "repos/$REPO/commits/$SHA/pulls")
            # merge_commit_sha is the pushed head for merge, squash and rebase
            # merges alike; any other associated PR merely contains this commit.
            PR=$(jq -c --arg sha "$SHA" --arg base "$BRANCH" '
              [.[] | select(.merged_at != null and .merge_commit_sha == $sha and .base.ref == $base)]
              | first // empty' <<<"$PULLS")
            [ -n "$PR" ] && break
            echo "No merged PR associated with $SHA yet (attempt $attempt); retrying..."
            sleep 10
          done

          if [ -z "$PR" ]; then
            echo "::notice::No merged PR is associated with $SHA (direct push). No release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_NUMBER=$(jq -r '.number' <<<"$PR")
          PR_BODY=$(jq -r '.body // ""' <<<"$PR")
          echo "Found PR #$PR_NUMBER: $(jq -r '.title' <<<"$PR")"
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

          # --- Parse the Release: line ---
          RELEASE_LINE=$(grep -iP 'release:\s*v?\d+\.\d+\.\d+' <<<"$PR_BODY" | head -1 || true)
          if [ -z "$RELEASE_LINE" ]; then
            if grep -qiP '^\s*release:' <<<"$PR_BODY"; then
              echo "::error::PR #$PR_NUMBER has a 'Release:' line that is not a valid X.Y.Z version. No tag was created."
              exit 1
            fi
            echo "::notice::PR #$PR_NUMBER does not request a release. No release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(grep -oiP 'release:\s*v?\K\d+\.\d+\.\d+' <<<"$RELEASE_LINE" | head -1)
          VERSION="v$VERSION"
          AUTO=false
          if grep -qF '<!-- release-validation:auto -->' <<<"$RELEASE_LINE"; then
            AUTO=true
          fi
          echo "Requested release: $VERSION (auto-added: $AUTO)"

          # --- Re-run: this commit is already tagged, so finish that release ---
          EXISTING_TAG=$(git tag --points-at "$SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -n "$EXISTING_TAG" ]; then
            echo "Commit $SHA is already tagged $EXISTING_TAG; continuing that release (re-run)."
            echo "version=$EXISTING_TAG" >> "$GITHUB_OUTPUT"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --- Re-validate against the latest release at merge time ---
          LATEST=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name' 2>/dev/null || true)

          is_valid_next() {
            local latest="${1#v}" prop="${2#v}"
            local lM lm lp pM pm pp
            IFS=. read -r lM lm lp <<<"$latest"
            IFS=. read -r pM pm pp <<<"$prop"
            if [ "$pM" -eq "$lM" ] && [ "$pm" -eq "$lm" ] && [ "$pp" -eq $((lp + 1)) ]; then return 0; fi
            if [ "$pM" -eq "$lM" ] && [ "$pm" -eq $((lm + 1)) ] && [ "$pp" -eq 0 ]; then return 0; fi
            if [ "$pM" -eq $((lM + 1)) ] && [ "$pm" -eq 0 ] && [ "$pp" -eq 0 ]; then return 0; fi
            return 1
          }

          if [ -n "$LATEST" ] && ! is_valid_next "$LATEST" "$VERSION"; then
            IFS=. read -r lM lm lp <<<"${LATEST#v}"
            NEXT_PATCH="v${lM}.${lm}.$((lp + 1))"
            if [ "$AUTO" = "true" ]; then
              # The default patch version was claimed by another PR merged first.
              echo "::notice::Auto-added release $VERSION is stale (latest is $LATEST); using $NEXT_PATCH."
              VERSION="$NEXT_PATCH"
            else
              echo "::error::VERSION INCREMENT REJECTED for PR #$PR_NUMBER: $VERSION is not a valid next release after $LATEST. Allowed: $NEXT_PATCH, v${lM}.$((lm + 1)).0, v$((lM + 1)).0.0. No tag was created."
              exit 1
            fi
          fi

          # --- The tag must be new (this commit has no tag; checked above) ---
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists at $(git rev-parse "$VERSION^{commit}"), not at $SHA. PR #$PR_NUMBER was NOT released."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.version.outputs.release == 'true' && steps.version.outputs.tag_exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PR_LINK="https://github.com/${REPO}/pull/${PR_NUMBER}"
          git tag -a "$VERSION" \
            -m "Release $VERSION" \
            -m "PR: ${PR_LINK}" \
            -m "Commit: ${SHA}" \
            -m "automated-release: tag-on-merge.yml"
          # Token is used only for this push; it is not persisted in .git/config.
          git push "https://x-access-token:${RELEASE_PAT}@github.com/${REPO}.git" "refs/tags/$VERSION"

          echo "Created and pushed tag $VERSION (PR: ${PR_LINK}, commit: ${SHA})"

  release:
    needs: tag
    if: needs.tag.outputs.release == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.tag.outputs.version }}
    secrets:
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}

  publish-npm:
    needs: [tag, release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: ${{ needs.tag.outputs.version }}
    steps:
      # publish-npm.yml runs as its own workflow (npm trusted publishing is
      # bound to that workflow file), so dispatch it and wait for the result.
      - name: Dispatch npm publish and wait for it
        run: |
          set -euo pipefail
          DISPATCH_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh workflow run publish-npm.yml --repo "$REPO" \
            -f tag="$TAG" -f dispatch_id="$DISPATCH_ID"

          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID=$(gh run list --repo "$REPO" --workflow publish-npm.yml \
              --event workflow_dispatch --limit 20 --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle | contains(\"[$DISPATCH_ID]\")) | .databaseId" | head -1)
            [ -n "$RUN_ID" ] && break
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::Dispatched publish-npm.yml for $TAG but could not find the run."
            exit 1
          fi

          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          echo "Waiting for npm publish run: $RUN_URL"
          if ! gh run watch "$RUN_ID" --repo "$REPO" --exit-status --interval 30 >/dev/null; then
            echo "::error::npm publish for $TAG failed: $RUN_URL"
            exit 1
          fi
          echo "npm publish for $TAG succeeded: $RUN_URL"
