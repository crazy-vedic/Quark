name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.3.37)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Validate npm packages exist
        run: |
          set -euo pipefail
          for p in npm/platforms/*/ npm/quark/; do
            test -f "${p}package.json" || { echo "::error::missing ${p}package.json"; exit 1; }
          done
          for f in npm/quark/package.json npm/platforms/*/package.json; do
            node -e "const p=require('./$f'); if (p.name.indexOf('@quark-client/')!==0) { console.error('bad name', p.name, '$f'); process.exit(1) }"
          done
          echo "✓ All npm packages valid"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          mkdir -p dist/binaries
          gh release download "$TAG" \
            --pattern "quark-*" \
            --dir dist/binaries \
            --repo crazy-vedic/Quark

      - name: Pack npm packages and add optionalDependencies
        run: |
          TAG="${{ inputs.tag }}"
          node scripts/npm-pack.mjs "${TAG#v}" --with-deps

      - name: Publish platform packages
        run: |
          set -u
          cd npm
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          FAILED=0

          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            PKG="@quark-client/quark-${platform}"
            # Check if version already exists
            if npm view "${PKG}@${VERSION}" version &>/dev/null; then
              echo "✓ ${PKG}@${VERSION} already published, skipping"
            else
              # Dry run first
              if ! npm publish "./platforms/${platform}" --access public --provenance --dry-run --verbose 2>&1 | tee /tmp/npm-output.log; then
                echo "❌ Dry run failed for ${PKG}@${VERSION}"
                FAILED=$((FAILED + 1))
                continue
              fi
              # Then publish for real
              if ! npm publish "./platforms/${platform}" --access public --provenance --verbose 2>&1 | tee /tmp/npm-output.log; then
                # Check if it's a 422 (already exists) error
                if grep -q "E422\|already_exists" /tmp/npm-output.log; then
                  echo "⚠ ${PKG}@${VERSION} already published (422), skipping"
                else
                  echo "❌ Failed to publish ${PKG}@${VERSION}"
                  FAILED=$((FAILED + 1))
                fi
                continue
              fi
              echo "✓ Published ${PKG}@${VERSION}"
            fi
          done

          if [ $FAILED -gt 0 ]; then
            echo "❌ Failed to publish $FAILED platform package(s)"
            exit 1
          fi

      - name: Publish main package
        run: |
          set -u
          cd npm
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          PKG="@quark-client/quark"

          # Check if version already exists
          if npm view "${PKG}@${VERSION}" version &>/dev/null; then
            echo "✓ ${PKG}@${VERSION} already published"
          else
            # Dry run first
            if ! npm publish "./quark" --access public --provenance --dry-run --verbose 2>&1 | tee /tmp/npm-output.log; then
              echo "❌ Dry run failed for ${PKG}@${VERSION}"
              exit 1
            fi
            # Then publish for real
            if ! npm publish "./quark" --access public --provenance --verbose 2>&1 | tee /tmp/npm-output.log; then
              # Check if it's a 422 (already exists) error
              if grep -q "E422\|already_exists" /tmp/npm-output.log; then
                echo "⚠ ${PKG}@${VERSION} already published (422), skipping"
              else
                echo "❌ Failed to publish ${PKG}@${VERSION}"
                exit 1
              fi
            else
              echo "✓ Published ${PKG}@${VERSION}"
            fi
          fi
