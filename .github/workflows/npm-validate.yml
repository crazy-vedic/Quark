name: npm Package Validation

# Runs before merge on packaging changes, so a broken npm package blocks the PR
# instead of being reported after the release has already shipped.
on:
  pull_request:
    branches: ["master", "main"]
    paths:
      - '.goreleaser.yaml'
      - 'npm/**'
      - 'scripts/npm-pack.mjs'
      - 'scripts/gen-completions.sh'
      - '.github/workflows/npm-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          cache: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.3
          install-only: true

      - name: Build snapshot archives
        run: goreleaser release --snapshot --skip=publish --clean

      - name: Extract binaries from archives
        working-directory: dist
        run: |
          set -euo pipefail
          # After goreleaser: --clean wipes dist/.
          mkdir -p binaries
          for os in linux darwin; do
            for arch in amd64 arm64; do
              tar -xzf "quark-${os}-${arch}.tar.gz" -C binaries/ quark
              mv binaries/quark "binaries/quark-${os}-${arch}"
            done
          done
          unzip -o quark-windows-amd64.zip quark.exe -d binaries/
          mv binaries/quark.exe binaries/quark-windows-amd64.exe
          echo "✓ Binaries extracted"
          ls -lh binaries/

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Determine version
        run: |
          set -euo pipefail
          # The snapshot version baked into the binaries (e.g. 1.4.3-dev), so the
          # installed package can be checked against `quark --version`.
          VERSION=$(node -p "require('./dist/metadata.json').version")
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Pack npm packages
        run: node scripts/npm-pack.mjs "$VERSION"

      - name: Validate npm package structure
        run: |
          set -euo pipefail
          cd npm
          for pkgdir in quark platforms/*/; do
            pkgjson="${pkgdir%/}/package.json"
            test -f "$pkgjson" || { echo "✗ Missing $pkgjson"; exit 1; }
            version=$(node -p "require('./$pkgjson').version")
            if [ "$version" != "$VERSION" ]; then
              echo "✗ Version mismatch in $pkgdir: expected $VERSION, got $version"
              exit 1
            fi
            echo "✓ $pkgjson ($version)"
          done

      - name: Pack npm tarballs
        run: |
          set -euo pipefail
          cd npm
          mkdir -p packed
          for pkgdir in quark platforms/*/; do
            npm pack "./${pkgdir%/}" --pack-destination packed/
          done
          ls -lh packed/

      - name: Test installation and run
        run: |
          set -euo pipefail
          PLATFORM=$(node -p "process.platform + '-' + process.arch")
          cd npm/packed
          MAIN="$PWD/quark-client-quark-${VERSION}.tgz"
          PLAT="$PWD/quark-client-quark-${PLATFORM}-${VERSION}.tgz"
          test -f "$MAIN" && test -f "$PLAT"
          mkdir -p test-install && cd test-install
          npm init -y >/dev/null
          # Only this runner's platform package: the others fail npm's os/cpu check.
          npm install "$PLAT" "$MAIN" --no-save
          OUT=$(npx --no-install quark --version)
          echo "$OUT"
          grep -qF "$VERSION" <<<"$OUT"
          echo "✓ npm package installed and runs successfully"

      - name: Test global install (nested platform package)
        run: |
          set -euo pipefail
          # npm nests optional dependencies under the main package in a global
          # install (<root>/@quark-client/quark/node_modules/@quark-client/...),
          # which is the layout the launcher once failed to resolve on Windows.
          # The platform tarball isn't on the registry yet, so reproduce that
          # layout by installing it into the globally installed main package.
          PLATFORM=$(node -p "process.platform + '-' + process.arch")
          cd npm/packed
          MAIN="$PWD/quark-client-quark-${VERSION}.tgz"
          PLAT="$PWD/quark-client-quark-${PLATFORM}-${VERSION}.tgz"
          PREFIX="$(node -p "require('path').resolve('global-prefix')")"
          npm install -g --prefix "$PREFIX" "$MAIN"
          GROOT="$(npm root -g --prefix "$PREFIX")"
          MAINDIR="$GROOT/@quark-client/quark"
          (cd "$MAINDIR" && npm install --no-save --no-package-lock "$PLAT")
          NESTED="$MAINDIR/node_modules/@quark-client/quark-${PLATFORM}"
          test -f "$NESTED/package.json"
          # The platform package must be nested only, not hoisted to the global root.
          test ! -e "$GROOT/@quark-client/quark-${PLATFORM}"
          # Run the launcher script from the global install (works on every OS
          # without relying on PATH or .cmd shims).
          OUT=$(node "$MAINDIR/bin/quark.js" --version)
          echo "$OUT"
          grep -qF "$VERSION" <<<"$OUT"
          echo "✓ global install with nested platform package runs successfully"
