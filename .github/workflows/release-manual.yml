name: Manual Release

# Build and publish (or repair) the release for an existing tag. Safe to
# re-run: see release-build.yml.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.1.0)'
        required: true
        type: string

# Shared with tag-on-merge.yml so manual and automatic releases never overlap.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify tag exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format: $TAG (expected vX.Y.Z)"
            exit 1
          fi
          if ! gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG does not exist. Create it first:"
            echo "  git tag -a $TAG -m \"Release $TAG\" && git push origin $TAG"
            exit 1
          fi
          echo "Tag $TAG exists."

  release:
    needs: verify
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ inputs.tag }}
    secrets:
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
