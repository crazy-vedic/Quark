name: Publish to Homebrew

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish-homebrew:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          echo "Downloading assets for release: $RELEASE_TAG"

          mkdir -p /tmp/assets
          cd /tmp/assets

          # Download SHA256SUMS to get correct checksums
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "SHA256SUMS" \
            || echo "No SHA256SUMS found"

          # Download macOS and Linux archives
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "quark-darwin*tar.gz" \
            --pattern "quark-linux*tar.gz" \
            || echo "No archives found"

          ls -lah

      - name: Calculate checksums and prepare formula
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          VERSION="${RELEASE_TAG#v}"

          # Get checksums from SHA256SUMS
          cd /tmp/assets

          ARM64_CHECKSUM=$(grep quark-darwin-arm64.tar.gz SHA256SUMS | awk '{print $1}')
          echo "ARM64_CHECKSUM=$ARM64_CHECKSUM" >> $GITHUB_ENV

          AMD64_CHECKSUM=$(grep quark-darwin-amd64.tar.gz SHA256SUMS | awk '{print $1}')
          echo "AMD64_CHECKSUM=$AMD64_CHECKSUM" >> $GITHUB_ENV

          LINUX_AMD64_CHECKSUM=$(grep quark-linux-amd64.tar.gz SHA256SUMS | awk '{print $1}')
          echo "LINUX_AMD64_CHECKSUM=$LINUX_AMD64_CHECKSUM" >> $GITHUB_ENV

          LINUX_ARM64_CHECKSUM=$(grep quark-linux-arm64.tar.gz SHA256SUMS | awk '{print $1}')
          echo "LINUX_ARM64_CHECKSUM=$LINUX_ARM64_CHECKSUM" >> $GITHUB_ENV

          echo "macOS ARM64: $ARM64_CHECKSUM"
          echo "macOS AMD64: $AMD64_CHECKSUM"
          echo "Linux AMD64: $LINUX_AMD64_CHECKSUM"
          echo "Linux ARM64: $LINUX_ARM64_CHECKSUM"

          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Checkout homebrew tap repository
        uses: actions/checkout@v4
        with:
          repository: crazy-vedic/homebrew-quark
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew formula
        run: |
          FORMULA_DIR="homebrew-tap/Formula"
          mkdir -p "$FORMULA_DIR"

          {
            echo 'class Quark < Formula'
            echo '  desc "Quark - A fast and lightweight utility"'
            echo '  homepage "https://github.com/crazy-vedic/Quark"'
            echo "  version \"$VERSION\""
            echo ''
            echo '  on_macos do'
            echo '    if Hardware::CPU.arm?'
            echo "      url \"https://github.com/crazy-vedic/Quark/releases/download/v$VERSION/quark-darwin-arm64.tar.gz\""
            echo "      sha256 \"$ARM64_CHECKSUM\""
            echo '    else'
            echo "      url \"https://github.com/crazy-vedic/Quark/releases/download/v$VERSION/quark-darwin-amd64.tar.gz\""
            echo "      sha256 \"$AMD64_CHECKSUM\""
            echo '    end'
            echo '  end'
            echo ''
            echo '  on_linux do'
            echo '    if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?'
            echo "      url \"https://github.com/crazy-vedic/Quark/releases/download/v$VERSION/quark-linux-arm64.tar.gz\""
            echo "      sha256 \"$LINUX_ARM64_CHECKSUM\""
            echo '    else'
            echo "      url \"https://github.com/crazy-vedic/Quark/releases/download/v$VERSION/quark-linux-amd64.tar.gz\""
            echo "      sha256 \"$LINUX_AMD64_CHECKSUM\""
            echo '    end'
            echo '  end'
            echo ''
            echo '  def install'
            echo '    bin.install "quark"'
            echo '    bash_completion.install "completions/quark.bash" => "quark"'
            echo '    zsh_completion.install "completions/_quark"'
            echo '    fish_completion.install "completions/quark.fish"'
            echo '  end'
            echo ''
            echo '  test do'
            echo '    system "#{bin}/quark", "--version"'
            echo '  end'
            echo 'end'
          } > "$FORMULA_DIR/quark.rb"

      - name: Commit and push formula
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Formula/quark.rb

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update quark formula to v${{ env.VERSION }}"
            git push origin HEAD
            echo "Published to homebrew tap"
          fi

      - name: Update release notes (macOS)
        if: github.event.action == 'published'
        uses: actions/github-script@v7
        with:
          script: |
            const releaseBody = `${{ github.event.release.body }}\n\n✅ **Published to Homebrew:**\n\`\`\`bash\nbrew tap crazy-vedic/quark\nbrew install quark\n\`\`\``;
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              body: releaseBody
            });
