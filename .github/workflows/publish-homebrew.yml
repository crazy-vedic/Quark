name: Publish to Homebrew

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.2.3)'
        required: true

# One tap writer at a time.
concurrency:
  group: homebrew-tap
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  publish-homebrew:
    runs-on: macos-latest
    steps:
      - name: Validate tag
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Download and verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Downloading assets for release: $RELEASE_TAG"
          mkdir -p /tmp/assets
          cd /tmp/assets

          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "SHA256SUMS" \
            --pattern "quark-darwin-*.tar.gz" \
            --pattern "quark-linux-*.tar.gz"

          : > selected.sums
          for asset in quark-darwin-arm64.tar.gz quark-darwin-amd64.tar.gz quark-linux-amd64.tar.gz quark-linux-arm64.tar.gz; do
            test -f "$asset" || { echo "::error::$asset is missing from release $RELEASE_TAG"; exit 1; }
            line=$(grep -E "^[0-9a-f]{64}  ${asset}\$" SHA256SUMS) || { echo "::error::$asset is not listed in SHA256SUMS"; exit 1; }
            echo "$line" >> selected.sums
          done
          shasum -a 256 --check --strict selected.sums
          ls -lah

      - name: Read checksums for formula
        working-directory: /tmp/assets
        run: |
          set -euo pipefail
          sum() { awk -v name="$1" '$2 == name {print $1}' selected.sums; }
          ARM64_CHECKSUM=$(sum quark-darwin-arm64.tar.gz)
          AMD64_CHECKSUM=$(sum quark-darwin-amd64.tar.gz)
          LINUX_AMD64_CHECKSUM=$(sum quark-linux-amd64.tar.gz)
          LINUX_ARM64_CHECKSUM=$(sum quark-linux-arm64.tar.gz)
          for v in "$ARM64_CHECKSUM" "$AMD64_CHECKSUM" "$LINUX_AMD64_CHECKSUM" "$LINUX_ARM64_CHECKSUM"; do
            [[ "$v" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Bad or empty checksum: '$v'"; exit 1; }
          done
          {
            echo "ARM64_CHECKSUM=$ARM64_CHECKSUM"
            echo "AMD64_CHECKSUM=$AMD64_CHECKSUM"
            echo "LINUX_AMD64_CHECKSUM=$LINUX_AMD64_CHECKSUM"
            echo "LINUX_ARM64_CHECKSUM=$LINUX_ARM64_CHECKSUM"
          } >> "$GITHUB_ENV"
          cat selected.sums

      - name: Checkout homebrew tap repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crazy-vedic/homebrew-quark
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew formula
        run: |
          set -euo pipefail
          FORMULA_DIR="homebrew-tap/Formula"
          mkdir -p "$FORMULA_DIR"

          {
            echo 'class Quark < Formula'
            echo '  desc "Fast and lightweight utility"'
            echo '  homepage "https://github.com/crazy-vedic/Quark"'
            echo ''
            echo '  on_macos do'
            echo '    if Hardware::CPU.arm?'
            echo "      url \"https://github.com/crazy-vedic/Quark/releases/download/v$VERSION/quark-darwin-arm64.tar.gz\""
            echo "      sha256 \"$ARM64_CHECKSUM\""
            echo '    else'
            echo "      url \"https://github.com/crazy-vedic/Quark/releases/download/v$VERSION/quark-darwin-amd64.tar.gz\""
            echo "      sha256 \"$AMD64_CHECKSUM\""
            echo '    end'
            echo '  end'
            echo ''
            echo '  on_linux do'
            echo '    if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?'
            echo "      url \"https://github.com/crazy-vedic/Quark/releases/download/v$VERSION/quark-linux-arm64.tar.gz\""
            echo "      sha256 \"$LINUX_ARM64_CHECKSUM\""
            echo '    else'
            echo "      url \"https://github.com/crazy-vedic/Quark/releases/download/v$VERSION/quark-linux-amd64.tar.gz\""
            echo "      sha256 \"$LINUX_AMD64_CHECKSUM\""
            echo '    end'
            echo '  end'
            echo ''
            echo '  def install'
            echo '    bin.install "quark"'
            echo '    bash_completion.install "completions/quark.bash" => "quark"'
            echo '    zsh_completion.install "completions/_quark"'
            echo '    fish_completion.install "completions/quark.fish"'
            echo '  end'
            echo ''
            echo '  test do'
            echo '    system bin/"quark", "--version"'
            echo '  end'
            echo 'end'
          } > "$FORMULA_DIR/quark.rb"

      - name: Commit and push formula
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Formula/quark.rb

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update quark formula to v${VERSION}"
            git push origin HEAD
            echo "Published to homebrew tap"
          fi

  smoke-test:
    needs: publish-homebrew
    runs-on: macos-latest
    steps:
      - name: Install from the tap and run it
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          brew tap crazy-vedic/quark
          brew install crazy-vedic/quark/quark
          OUT=$(quark --version)
          echo "$OUT"
          grep -qF "$VERSION" <<<"$OUT" || { echo "::error::Installed quark does not report version $VERSION"; exit 1; }

  release-notes:
    needs: publish-homebrew
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with publish-apt.yml: serializes edits to the release body.
    concurrency:
      group: release-notes-${{ github.event.release.tag_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Update release notes (Homebrew)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NOTE_MARKER: homebrew
          NOTE_TEXT: "✅ **Published to Homebrew:**\n```bash\nbrew tap crazy-vedic/quark\nbrew install quark\n```"
        with:
          script: |
            const appendNote = require('./.github/scripts/append-release-note.js');
            await appendNote({ github, context, core });
