name: Publish to apt Repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.2.3)'
        required: true

# One gh-pages writer at a time.
concurrency:
  group: gh-pages-apt
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  publish-apt:
    runs-on: ubuntu-latest
    environment: apt-signing
    permissions:
      contents: write
    env:
      APT_KEY_ID: ${{ vars.APT_GPG_KEY_ID }}
    steps:
      - name: Validate tag
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Checkout master branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: master
          fetch-depth: 0

      - name: Checkout or create gh-pages branch
        run: |
          set -euo pipefail
          git fetch origin gh-pages 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
            echo "# Quark apt Repository" > README.md
            git add README.md
            git commit -m "Initial gh-pages commit"
          fi

      - name: Set up apt repository structure
        run: |
          set -euo pipefail
          mkdir -p apt/conf apt/pool/main/q/quark

          # Create distributions file with proper SignWith (always overwrite)
          cat > apt/conf/distributions <<EOF
          Origin: Quark
          Label: Quark
          Suite: stable
          Codename: stable
          Components: main
          Architectures: amd64 arm64
          SignWith: ${APT_KEY_ID}
          EOF

      - name: Install reprepro and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro gnupg2

      - name: Download and verify .deb packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Downloading packages for release: $RELEASE_TAG"
          mkdir -p /tmp/debs
          cd /tmp/debs

          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.deb" --pattern "SHA256SUMS"

          for arch in amd64 arm64; do
            deb="quark_${VERSION}_${arch}.deb"
            test -f "$deb" || { echo "::error::$deb is missing from release $RELEASE_TAG"; exit 1; }
            grep -qE "^[0-9a-f]{64}  ${deb}\$" SHA256SUMS || { echo "::error::$deb is not listed in SHA256SUMS"; exit 1; }
          done
          sha256sum --check --ignore-missing --strict SHA256SUMS
          ls -lah ./*.deb

      - name: Import signing key
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
          # The private key is exposed to this step only.
          APT_PRIVATE_KEY_B64: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APT_PRIVATE_KEY_B64" ] || [ -z "$APT_KEY_ID" ]; then
            echo "::error::apt signing key or key ID is not configured in the apt-signing environment"
            exit 1
          fi
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          printf '%s' "$APT_PRIVATE_KEY_B64" | base64 -d | gpg --batch --import
          # Fail fast if the key ID does not match an imported secret key
          gpg --batch --list-secret-keys "$APT_KEY_ID" >/dev/null
          echo "Signing key present: $APT_KEY_ID"

      - name: Add packages
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          set -euo pipefail
          for deb in /tmp/debs/quark_"${VERSION}"_*.deb; do
            pkg=$(dpkg-deb -f "$deb" Package)
            ver=$(dpkg-deb -f "$deb" Version)
            arch=$(dpkg-deb -f "$deb" Architecture)
            if reprepro -b apt list stable "$pkg" | grep -q " $arch: $ver"; then
              echo "Already present: $pkg $ver $arch"
            else
              reprepro -b apt includedeb stable "$deb"
            fi
          done
          reprepro -b apt check stable

      - name: Generate repository index
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/apt"
          reprepro -b . createsymlinks || true
          test -f dists/stable/Release || { echo "::error::dists/stable/Release was not generated"; exit 1; }
          test -f dists/stable/InRelease || { echo "::error::dists/stable/InRelease was not generated (signing failed?)"; exit 1; }
          ls -lah dists/stable/

      - name: Publish public key
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          set -euo pipefail
          gpg --batch --export "$APT_KEY_ID" > apt/quark-archive-key.gpg

      - name: Remove signing key from runner
        if: always()
        run: rm -rf "${{ runner.temp }}/gnupg"

      - name: Create README for apt repository
        run: |
          mkdir -p ${{ github.workspace }}/apt
          cat > ${{ github.workspace }}/apt/README.md <<'README'
          # Quark apt Repository

          ## Installation

          Add the repository and install Quark:

          ```bash
          curl -fsSL https://crazy-vedic.github.io/Quark/apt/quark-archive-key.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/quark-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/quark-archive-keyring.gpg] https://crazy-vedic.github.io/Quark/apt stable main" \
            | sudo tee /etc/apt/sources.list.d/quark.list
          sudo apt update && sudo apt install quark
          ```

          ## Verification

          The repository is signed with a GPG key. Your system will automatically verify the signature using the key installed above.

          To manually verify the Release file:

          ```bash
          gpg --verify apt/dists/stable/Release.gpg apt/dists/stable/Release
          ```
          README

      - name: Verify apt repository
        run: |
          set -euo pipefail
          LISTING=$(reprepro -b "${{ github.workspace }}/apt" list stable quark)
          echo "$LISTING"
          for arch in amd64 arm64; do
            grep -q " $arch: $VERSION\$" <<<"$LISTING" || { echo "::error::quark $VERSION ($arch) is not in the repository"; exit 1; }
          done

      - name: Commit and push to gh-pages
        run: |
          set -euo pipefail
          cd ${{ github.workspace }}

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add apt/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish packages from release ${RELEASE_TAG}"
            git push origin gh-pages
            echo "Published to gh-pages branch"
          fi

  smoke-test:
    needs: publish-apt
    runs-on: ubuntu-latest
    steps:
      - name: Install from the apt repository and run it
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          curl -fsSL https://crazy-vedic.github.io/Quark/apt/quark-archive-key.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/quark-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/quark-archive-keyring.gpg] https://crazy-vedic.github.io/Quark/apt stable main" \
            | sudo tee /etc/apt/sources.list.d/quark.list

          # GitHub Pages takes a few minutes to deploy the gh-pages push.
          for attempt in $(seq 1 20); do
            sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/quark.list \
              -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 >/dev/null
            if apt-cache madison quark | grep -qF "| $VERSION |"; then break; fi
            if [ "$attempt" -eq 20 ]; then
              echo "::error::quark $VERSION never appeared in the apt repository"
              apt-cache madison quark || true
              exit 1
            fi
            echo "quark $VERSION not served yet (attempt $attempt); waiting..."
            sleep 30
          done

          sudo apt-get install -y "quark=${VERSION}"
          OUT=$(quark --version)
          echo "$OUT"
          grep -qF "$VERSION" <<<"$OUT" || { echo "::error::Installed quark does not report version $VERSION"; exit 1; }

  release-notes:
    needs: publish-apt
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with publish-homebrew.yml: serializes edits to the release body.
    concurrency:
      group: release-notes-${{ github.event.release.tag_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Update release notes (apt)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          NOTE_MARKER: apt
          NOTE_TEXT: "✅ **APT packages published:** https://crazy-vedic.github.io/Quark/apt"
        with:
          script: |
            const appendNote = require('./.github/scripts/append-release-note.js');
            await appendNote({ github, context, core });
