name: Publish to apt Repository

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish-apt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Checkout or create gh-pages branch
        run: |
          git fetch origin gh-pages 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
            echo "# Quark apt Repository" > README.md
            git add README.md
            git commit -m "Initial gh-pages commit"
          fi

      - name: Set up apt repository structure
        run: |
          mkdir -p apt/conf apt/pool/main/q/quark

          # Create distributions file (unsigned)
          if [ ! -f apt/conf/distributions ]; then
            {
              echo "Origin: Quark"
              echo "Label: Quark"
              echo "Suite: stable"
              echo "Codename: stable"
              echo "Version: 1.0"
              echo "Components: main"
              echo "Architectures: amd64 arm64"
            } > apt/conf/distributions
          fi

      - name: Install reprepro
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro

      - name: Download .deb packages from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          echo "Downloading packages for release: $RELEASE_TAG"

          mkdir -p /tmp/debs
          cd /tmp/debs

          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.deb" \
            || echo "No .deb files found in release"

          ls -lah *.deb 2>/dev/null || echo "No .deb packages downloaded"

      - name: Add packages to repository
        run: |
          cd ${{ github.workspace }}

          for deb in /tmp/debs/*.deb; do
            if [ -f "$deb" ]; then
              echo "Adding: $deb"
              reprepro -b apt includedeb stable "$deb"
            fi
          done

          reprepro -b apt list stable || echo "Repository may be empty"

      - name: Generate repository index
        run: |
          cd ${{ github.workspace }}/apt
          reprepro -b . createsymlinks || true
          ls -lah dists/stable/Release* 2>/dev/null || echo "Release file created"

      - name: Create README for apt repository
        run: |
          mkdir -p ${{ github.workspace }}/apt
          {
            echo "# Quark apt Repository"
            echo ""
            echo "Install Quark from this repository:"
            echo ""
            echo "    echo \"deb [trusted=yes] https://crazy-vedic.github.io/Quark/apt stable main\" | sudo tee /etc/apt/sources.list.d/quark.list"
            echo "    sudo apt update"
            echo "    sudo apt install quark"
          } > ${{ github.workspace }}/apt/README.md

      - name: Commit and push to gh-pages
        run: |
          cd ${{ github.workspace }}

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add apt/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish packages from release ${{ github.event.release.tag_name }}"
            git push origin gh-pages
            echo "Published to gh-pages branch"
          fi

      - name: Verify apt repository
        run: |
          echo "Repository structure:"
          find ${{ github.workspace }}/apt -type f | head -20

          echo ""
          echo "Packages in repository:"
          reprepro -b ${{ github.workspace }}/apt list stable || echo "Repository may be empty"

      - name: Update release notes (apt)
        if: github.event.action == 'published'
        uses: actions/github-script@v7
        with:
          script: |
            const releaseBody = `${{ github.event.release.body }}\n\n✅ **APT packages published:** https://crazy-vedic.github.io/Quark/apt`;
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              body: releaseBody
            })
