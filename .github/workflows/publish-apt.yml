name: Publish to apt Repository

on:
  release:
    types: [published, created]

permissions:
  contents: write

jobs:
  publish-apt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Checkout or create gh-pages branch
        run: |
          git fetch origin gh-pages 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
            echo "# Quark apt Repository" > README.md
            git add README.md
            git commit -m "Initial gh-pages commit"
          fi

      - name: Set up apt repository structure
        run: |
          mkdir -p apt/conf apt/pool/main/q/quark

          # Create distributions file if it doesn't exist
          if [ ! -f apt/conf/distributions ]; then
            {
              echo "Origin: Quark"
              echo "Label: Quark"
              echo "Suite: stable"
              echo "Codename: stable"
              echo "Version: 1.0"
              echo "Components: main"
              echo "Architectures: amd64 arm64"
              echo "SignWith: ${{ vars.APT_GPG_KEY }}"
            } > apt/conf/distributions
          fi

      - name: Install reprepro and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro gnupg2

      - name: Download .deb packages from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          echo "Downloading packages for release: $RELEASE_TAG"

          # Create temp directory for downloads
          mkdir -p /tmp/debs
          cd /tmp/debs

          # Download all .deb files from the release
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.deb" \
            || echo "No .deb files found in release (expected if using GoReleaser nfpms)"

          ls -lah *.deb 2>/dev/null || echo "No .deb packages downloaded"

      - name: Import GPG key (optional)
        env:
          GNUPGHOME: /tmp/gnupg
          GPG_KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          if [ -z "$GPG_KEY" ]; then
            echo "No GPG key configured, packages will be unsigned"
            exit 0
          fi
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          echo "$GPG_KEY" | base64 -d | gpg --import --batch --no-tty
          echo "GPG key imported"

      - name: Add packages to apt repository
        env:
          GNUPGHOME: /tmp/gnupg
        run: |
          cd ${{ github.workspace }}
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          # Start gpg-agent and preload passphrase if provided
          eval $(gpg-agent --daemon --quiet --allow-preset-passphrase)

          if [ -n "${{ env.APT_GPG_KEY_PASSPHRASE }}" ] && [ -n "${{ vars.APT_GPG_KEY }}" ]; then
            # Get keygrip for the key
            KEYGRIP=$(gpg --with-keygrip --list-secret-keys "${{ vars.APT_GPG_KEY }}" 2>/dev/null | \
              grep Keygrip | head -1 | awk '{print $NF}')

            if [ -n "$KEYGRIP" ]; then
              # Preload passphrase into gpg-agent
              echo "${{ env.APT_GPG_KEY_PASSPHRASE }}" | gpg-preset-passphrase --preset "$KEYGRIP"
              if [ $? -ne 0 ]; then
                echo "ERROR: Failed to preload passphrase into gpg-agent"
                exit 1
              fi
            else
              echo "ERROR: Could not find keygrip for key ${{ vars.APT_GPG_KEY }}"
              exit 1
            fi
          fi

          # Add each .deb file to the repository
          for deb in /tmp/debs/*.deb; do
            if [ -f "$deb" ]; then
              echo "Adding: $deb"
              # reprepro uses SignWith from distributions config
              # GPG key was already imported above; reprepro will use it via gpg-agent
              reprepro -b apt -S main includedeb stable "$deb"
            fi
          done

          # Verify packages were added
          reprepro -b apt list stable || echo "Repository may be empty (first release)"

      - name: Generate repository index
        run: |
          cd ${{ github.workspace }}/apt

          # Create symlinks for direct package access
          reprepro -b . -S main createsymlinks || true

          # Ensure Release file exists and is readable
          ls -lah dists/stable/Release* 2>/dev/null || echo "Release file will be created"

      - name: Create public key file
        run: |
          mkdir -p ${{ github.workspace }}/apt
          if [ -n "${{ vars.APT_GPG_KEY }}" ]; then
            gpg --export "${{ vars.APT_GPG_KEY }}" > ${{ github.workspace }}/apt/KEY.pub
          fi

      - name: Create README for apt repository
        run: |
          cat > ${{ github.workspace }}/apt/README.md << 'READMEEOF'
          # Quark apt Repository

          Install Quark from this repository:

              echo "deb [trusted=yes] https://crazy-vedic.github.io/Quark/apt stable main" | sudo tee /etc/apt/sources.list.d/quark.list
              sudo apt update
              sudo apt install quark

          For signed packages (requires GPG key):

              curl -fsSL https://crazy-vedic.github.io/Quark/apt/KEY.pub | sudo apt-key add -
              echo "deb https://crazy-vedic.github.io/Quark/apt stable main" | sudo tee /etc/apt/sources.list.d/quark.list
              sudo apt update
              sudo apt install quark
          READMEEOF

      - name: Commit and push to gh-pages
        run: |
          cd ${{ github.workspace }}

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add apt/

          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish packages from release ${{ github.event.release.tag_name }}"
            git push origin gh-pages
            echo "Published to gh-pages branch"
          fi

      - name: Verify apt repository
        run: |
          echo "Repository structure:"
          find ${{ github.workspace }}/apt -type f | head -20

          echo ""
          echo "Packages in repository:"
          reprepro -b ${{ github.workspace }}/apt list stable || echo "Repository may be empty"

      - name: Comment on release
        if: github.event.action == 'published'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ apt packages published to https://crazy-vedic.github.io/Quark/apt'
            })
