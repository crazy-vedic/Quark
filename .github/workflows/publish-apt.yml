name: Publish to apt Repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (empty for triggering release tag)'
        required: false

permissions:
  contents: write

jobs:
  publish-apt:
    runs-on: ubuntu-latest
    environment: apt-signing
    env:
      APT_KEY_ID: ${{ vars.APT_GPG_KEY_ID }}
      APT_PRIVATE_KEY_B64: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Checkout or create gh-pages branch
        run: |
          git fetch origin gh-pages 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
            echo "# Quark apt Repository" > README.md
            git add README.md
            git commit -m "Initial gh-pages commit"
          fi

      - name: Set up apt repository structure
        run: |
          mkdir -p apt/conf apt/pool/main/q/quark

          # Create distributions file with proper SignWith (always overwrite)
          cat > apt/conf/distributions <<EOF
          Origin: Quark
          Label: Quark
          Suite: stable
          Codename: stable
          Components: main
          Architectures: amd64 arm64
          SignWith: ${APT_KEY_ID}
          EOF

      - name: Install reprepro and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro gnupg2

      - name: Download .deb packages from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ inputs.tag || github.event.release.tag_name }}"
          echo "Downloading packages for release: $RELEASE_TAG"

          # Create temp directory for downloads
          mkdir -p /tmp/debs
          cd /tmp/debs

          # Download all .deb files from the release
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.deb" \
            || echo "No .deb files found in release (expected if using GoReleaser nfpms)"

          ls -lah *.deb 2>/dev/null || echo "No .deb packages downloaded"

      - name: Import signing key
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          set -euo pipefail
          if [ -z "$APT_PRIVATE_KEY_B64" ] || [ -z "$APT_KEY_ID" ]; then
            echo "::error::apt signing key or key ID is not configured in the apt-signing environment"
            exit 1
          fi
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          printf '%s' "$APT_PRIVATE_KEY_B64" | base64 -d | gpg --batch --import
          # Fail fast if the key ID does not match an imported secret key
          gpg --batch --list-secret-keys "$APT_KEY_ID" >/dev/null
          echo "Signing key present: $APT_KEY_ID"

      - name: Add packages
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          set -euo pipefail
          for deb in /tmp/debs/*.deb; do
            [ -f "$deb" ] || continue
            pkg=$(dpkg-deb -f "$deb" Package)
            ver=$(dpkg-deb -f "$deb" Version)
            arch=$(dpkg-deb -f "$deb" Architecture)
            if reprepro -b apt list stable "$pkg" | grep -q " $arch: $ver"; then
              echo "Already present: $pkg $ver $arch"
            else
              reprepro -b apt includedeb stable "$deb"
            fi
          done
          reprepro -b apt check stable

      - name: Generate repository index
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          cd ${{ github.workspace }}/apt
          reprepro -b . createsymlinks || true
          ls -lah dists/stable/Release* 2>/dev/null || echo "Release file will be created"

      - name: Publish public key
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          set -euo pipefail
          gpg --batch --export "$APT_KEY_ID" > apt/quark-archive-key.gpg

      - name: Create README for apt repository
        run: |
          mkdir -p ${{ github.workspace }}/apt
          cat > ${{ github.workspace }}/apt/README.md <<'README'
          # Quark apt Repository

          ## Installation

          Add the repository and install Quark:

          ```bash
          curl -fsSL https://crazy-vedic.github.io/Quark/apt/quark-archive-key.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/quark-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/quark-archive-keyring.gpg] https://crazy-vedic.github.io/Quark/apt stable main" \
            | sudo tee /etc/apt/sources.list.d/quark.list
          sudo apt update && sudo apt install quark
          ```

          ## Verification

          The repository is signed with a GPG key. Your system will automatically verify the signature using the key installed above.

          To manually verify the Release file:

          ```bash
          gpg --verify apt/dists/stable/Release.gpg apt/dists/stable/Release
          ```
          README

      - name: Commit and push to gh-pages
        run: |
          cd ${{ github.workspace }}

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add apt/

          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish packages from release ${{ github.event.release.tag_name }}"
            git push origin gh-pages
            echo "Published to gh-pages branch"
          fi

      - name: Verify apt repository
        run: |
          echo "Repository structure:"
          find ${{ github.workspace }}/apt -type f | head -20

          echo ""
          echo "Packages in repository:"
          reprepro -b ${{ github.workspace }}/apt list stable || echo "Repository may be empty"

      - name: Update release notes (apt)
        if: github.event.action == 'published'
        uses: actions/github-script@v7
        with:
          script: |
            const releaseBody = `${{ github.event.release.body }}\n\n✅ **APT packages published:** https://crazy-vedic.github.io/Quark/apt`;
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              body: releaseBody
            })
