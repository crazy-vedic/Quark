name: Winget Manifest Validation

# Runs before merge on packaging changes (see npm-validate.yml).
on:
  pull_request:
    branches: ["master", "main"]
    paths:
      - '.goreleaser.yaml'
      - '.winget/**'
      - 'scripts/gen-completions.sh'
      - '.github/workflows/winget-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
          cache: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v1.26.2
          install-only: true

      # `release --snapshot`, not `build`: only release produces archives and SHA256SUMS.
      - name: Build snapshot archives
        run: goreleaser release --snapshot --skip=publish --clean

      - name: Verify Windows zip, binary and checksum
        run: |
          set -euo pipefail
          ZIP=dist/quark-windows-amd64.zip
          test -f "$ZIP" || { echo "❌ $ZIP not found"; exit 1; }
          test -f dist/SHA256SUMS || { echo "❌ dist/SHA256SUMS not found"; exit 1; }
          unzip -l "$ZIP" | grep -q ' quark.exe$' || { echo "❌ quark.exe not in zip"; exit 1; }

          mkdir -p extracted
          unzip -o "$ZIP" quark.exe -d extracted/
          ./extracted/quark.exe --version

          LINE=$(grep -E '^[0-9a-f]{64}  quark-windows-amd64\.zip$' dist/SHA256SUMS) \
            || { echo "❌ zip not listed in SHA256SUMS"; exit 1; }
          (cd dist && sha256sum --check --strict <<<"$LINE")
          echo ""
          echo "Hash for winget manifest:"
          echo "$LINE"

      - name: Note on winget manifests
        run: |
          echo "ℹ️  Winget manifest generation requires GoReleaser v1.27+ (currently v1.26.2)"
          echo "Manifests are created manually via DISTRIBUTION.md or WINGET-AGENT-PLAN.md"
