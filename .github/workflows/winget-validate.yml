name: Winget Manifest Validation

# Runs before merge on packaging changes (see npm-validate.yml).
on:
  pull_request:
    branches: ["master", "main"]
    paths:
      - '.goreleaser.yaml'
      - '.winget/**'
      - 'scripts/gen-completions.sh'
      - '.github/workflows/winget-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          cache: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.3
          install-only: true

      # `release --snapshot`, not `build`: only release produces archives and SHA256SUMS.
      - name: Build snapshot archives
        run: goreleaser release --snapshot --skip=publish --clean

      - name: Verify Windows zip, binary and checksum
        run: |
          set -euo pipefail
          ZIP=dist/quark-windows-amd64.zip
          test -f "$ZIP" || { echo "❌ $ZIP not found"; exit 1; }
          test -f dist/SHA256SUMS || { echo "❌ dist/SHA256SUMS not found"; exit 1; }
          unzip -l "$ZIP" | grep -q ' quark.exe$' || { echo "❌ quark.exe not in zip"; exit 1; }

          mkdir -p extracted
          unzip -o "$ZIP" quark.exe -d extracted/
          ./extracted/quark.exe --version

          LINE=$(grep -E '^[0-9a-f]{64}  quark-windows-amd64\.zip$' dist/SHA256SUMS) \
            || { echo "❌ zip not listed in SHA256SUMS"; exit 1; }
          (cd dist && sha256sum --check --strict <<<"$LINE")
          echo ""
          echo "Hash for winget manifest:"
          echo "$LINE"

      - name: Verify winget manifests
        run: |
          set -euo pipefail
          shopt -s nullglob
          MANIFESTS=(dist/winget/manifests/q/Quark/Quark/*/Quark.Quark.installer.yaml)
          [ ${#MANIFESTS[@]} -gt 0 ] || { echo "❌ winget manifests not generated"; exit 1; }
          echo "Winget manifests generated (submission stays manual, see DISTRIBUTION.md):"
          printf '  %s\n' "${MANIFESTS[@]}"
