# Opens one weekly pull request per ecosystem (Go modules, GitHub Actions) that
# bundles every outdated dependency, major versions included.
# govulncheck (ci.yml) fails on known vulnerabilities; Dependabot keeps the gap small.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
