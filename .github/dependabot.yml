# Opens one weekly pull request per ecosystem (Go modules, GitHub Actions) that
# bundles every outdated dependency, major versions included.
# A release must be 14 days old before Dependabot proposes it, so a compromised
# or broken release is usually caught by others first. Security updates ignore
# the cooldown.
# govulncheck (ci.yml) fails on known vulnerabilities; Dependabot keeps the gap small.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns:
          - "*"
