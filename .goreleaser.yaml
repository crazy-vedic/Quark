version: 2

project_name: quark

# No `go mod tidy` here: the release must build exactly what is committed.
# CI checks tidiness instead (ci.yml, `go mod tidy -diff`). Completions go to
# the gitignored .completions/ dir so the hook never dirties tracked files.
before:
  hooks:
    - bash scripts/gen-completions.sh .completions

builds:
  - id: quark
    main: ./cmd/quark
    ldflags:
      - -X main.Version={{ .Version }}
      - -X main.Commit={{ .Commit }}
      - -X main.BuildTime={{ .Date }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
    env:
      - CGO_ENABLED=0
    binary: quark

archives:
  - id: unix
    ids:
      - quark
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    wrap_in_directory: false
    files:
      - src: .completions/*
        dst: completions
        strip_parent: true

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

source:
  enabled: false

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

release:
  github:
    owner: crazy-vedic
    name: Quark
  # Created as a draft; release-build.yml uploads the remaining assets and
  # publishes it only once everything is present.
  draft: true

nfpms:
  - id: quark-deb
    package_name: quark
    homepage: https://github.com/crazy-vedic/Quark
    description: "A local-first, keyboard-driven HTTP client"
    maintainer: "Quark Contributors <noreply@github.com>"
    license: MIT
    formats:
      - deb
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/quark/LICENSE
        type: file
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"

# Generates the Quark.Quark winget manifests (dist/winget/...) from the
# Windows zip. skip_upload keeps submission manual (DISTRIBUTION.md): to have
# GoReleaser open the winget-pkgs PR, give repository.token a PAT that can push
# to the fork and set skip_upload to auto.
winget:
  - name: Quark
    publisher: Quark
    package_identifier: Quark.Quark
    publisher_url: https://github.com/crazy-vedic/Quark
    homepage: https://github.com/crazy-vedic/Quark
    license: MIT
    license_url: https://github.com/crazy-vedic/Quark/blob/master/LICENSE
    short_description: "A local-first, keyboard-driven HTTP client"
    description: "Quark is a terminal-native HTTP client that keeps everything in a local SQLite database, with a scriptable CLI for automation and CI."
    tags:
      - api
      - cli
      - http
      - rest
      - tui
    ids:
      - unix
    skip_upload: true
    repository:
      owner: crazy-vedic
      name: winget-pkgs
      branch: "Quark.Quark-{{ .Version }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

announce:
  skip: true

# Homebrew formula is managed by publish-homebrew.yml workflow
# brews: []

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^Merge pull request"
